# KNOBI-SIX: device build + host tests + the CPU gate (fm1-emu job) on every push to phase1 and on demand; uploads the package, map and
# disassembly. (release.yml publishes tagged releases.) Toolchain and SDK as in release.yml.
name: build

on:
  push:
    branches: [phase1]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python packages
        run: python3 -m pip install --break-system-packages Pillow || sudo apt-get install -y python3-pil

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (Pro)
        run: |
          ./build.sh | tee build.log
          { echo '### Device build (Pro)'; echo '```'; grep -E 'ok   |app  |package' build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Host tests
        run: sh tests/run_tests.sh

      - name: CPU yardstick (host instructions per sample, x86-64)
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 >/dev/null || true
          for s in chord musical worst; do
            DINGHY_PERF=1 sh tests/run_host.sh tests/scripts/$s.txt | grep '^perf' || echo "$s: no hardware counter here"
          done
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq valgrind >/dev/null
          sh tests/cpu_host.sh tests/scripts/chord.txt 200 5000
          sh tests/cpu_host.sh tests/scripts/musical.txt 200 5000
          sh tests/cpu_host.sh tests/scripts/worst.txt 200 6000

      - uses: actions/upload-artifact@v4
        with:
          name: knobi-six-pro
          path: |
            build/*.fwsc
            build/app.map
            build/app.dis
          if-no-files-found: error

  # The CPU gate (Task 11, docs/MEASUREMENTS.md): cycles per 256-frame block of the synth, built with the JieLi clang
  # at the app's flags, run in joakimeriksson/fm1-emu (MIT, pinned) patched to count per-pc costs in two cycle models
  # (tests/cpu_emu/, after jhortale/smk37-analog spike/device-link spike/cpu by João Hortale). Builds and emulates only.
  fm1-emu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FM1_EMU_SHA: 60645a58d6cd1597ed565a3f00e4981964623232
    steps:
      - uses: actions/checkout@v4

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: fm1-emu (pinned, patched to record per-pc costs)
        run: |
          git clone --filter=blob:none https://github.com/joakimeriksson/fm1-emu.git ~/fm1-emu
          cd ~/fm1-emu && git checkout -q "$FM1_EMU_SHA"
          python3 "$GITHUB_WORKSPACE/tests/cpu_emu/patch_emu.py" ~/fm1-emu
          CARGO_PROFILE_RELEASE_LTO=false cargo build --release -p fm1-emu 2>&1 | tail -3

      - name: Cycles per block (init chord, musical stress, extreme; 6 and 4 voices)
        run: |
          bash tests/cpu_emu/run.sh ~/fm1-emu/target/release/fm1-emu build/emu
          { echo '### CPU gate (fm1-emu)'; cat build/emu/summary.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knobi-six-cpu
          path: |
            build/emu/summary.md
            build/emu/*.cost
            build/emu/*.log
            build/emu/*.nm
          if-no-files-found: warn
