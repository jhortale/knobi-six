# The TypeScript workspace (apps/, packages/, synths/; docs/MONOREPO.md): knobi-flash's protocol port checked against
# tools/fm1_install.py, the type check, the build and the tests (against a simulated keyboard), on every push and pull
# request that touches it. No JieLi toolchain needed. (release.yml deploys the installer on release tags.)
name: web

on:
  push:
    paths: &paths
      - 'apps/**'
      - 'packages/**'
      - 'synths/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tests/web_fixtures.py'
      - 'tools/fm1_install.py'
      - 'tools/build.py'
      - 'docs/IDENTITY.md'
      - 'docs/BACKUP.md'
      - '.github/workflows/web.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4          # the version from package.json's packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: The fixtures are what tools/fm1_install.py answers today
        run: python3 tests/web_fixtures.py --check packages/installer-core/test/fixtures/python.json

      - run: pnpm install --frozen-lockfile

      - name: Type check, build, tests (the installer's tests run after its build, so dist.test.ts checks the site)
        run: pnpm turbo run typecheck build test
