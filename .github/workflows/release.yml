# KNOBI-SIX: build the packages on GitHub, run the host tests, and on a tag <synth>-v<version> (e.g. knobi-six-v1.0)
# publish the release with a build attestation (actions/attest-build-provenance), then open a pull request that adds
# synths/<synth>/releases/<version>.md (release-pr.ts) for João to review and merge: the midi-chlorian portal publishes
# what is on main. Tags with anything after the version (knobi-six-v1.0-rc1) and the old v* tags do nothing: the `meta`
# job parses the tag and every later job waits for it. A published release never changes: the upload is refused when
# the GitHub release already has assets. The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh),
# the AC79 SDK from gitee.com, as in sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test
# build without a release (no upload, no pull request).
name: release

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      synth: ${{ steps.tag.outputs.synth }}
      version: ${{ steps.tag.outputs.version }}
      ok: ${{ steps.tag.outputs.ok }}
      release: ${{ steps.tag.outputs.release }}   # true only for a tag push: a manual run is a test build, even on a tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Parse the tag (a manual run is a test build, no tag)
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            node packages/content/src/cli/parse-tag.ts "$TAG" >> "$GITHUB_OUTPUT"
            grep -qx 'ok=true' "$GITHUB_OUTPUT" && echo "release=true" >> "$GITHUB_OUTPUT" || true
          fi

  firmware:
    needs: meta
    if: needs.meta.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    env:
      V: ${{ needs.meta.outputs.version }}
    steps:
      - name: Only knobi-six is built from this repository
        if: needs.meta.outputs.release == 'true' && needs.meta.outputs.synth != 'knobi-six'
        run: |
          echo "::error::${{ needs.meta.outputs.synth }}: no firmware build in this repository (only knobi-six); nothing was published"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (the Pro last, as the tests expect)
        run: |
          MODEL=elite sh build.sh
          MODEL=mke sh build.sh
          sh build.sh

      - name: Host tests
        run: sh tests/run_tests.sh

      - name: Release packages (tags only)
        if: needs.meta.outputs.release == 'true'
        run: |
          MODEL=elite sh build.sh --release "$V"
          MODEL=mke sh build.sh --release "$V"
          sh build.sh --release "$V"
          ls -l build/knobi-six-"$V"*.fwsc

      - name: Source archive and SHA256SUMS (tags only; the GPL source next to the packages on the portal)
        if: needs.meta.outputs.release == 'true'
        run: |
          # the OB-6 factory bank (Sequential's data) is never committed, so it is never in the archive
          test -z "$(git ls-files firmware/gen/factory_bank.h)"
          git archive --format=tar.gz --prefix="knobi-six-$V/" -o "build/knobi-six-$V-src.tar.gz" "$GITHUB_REF_NAME"
          # SHA256SUMS covers every file of the release: the packages and the source archive
          (cd build && sha256sum knobi-six-"$V"*.fwsc "knobi-six-$V-src.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: knobi-six-fwsc
          path: build/knobi-six*.fwsc
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: needs.meta.outputs.release == 'true'
        with:
          name: knobi-six-release
          path: |
            build/knobi-six-[0-9]*.fwsc
            build/SHA256SUMS
            build/knobi-six-*-src.tar.gz
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: needs.meta.outputs.release == 'true'
        continue-on-error: true            # the release does not depend on it (a private repository may not attest)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/knobi-six-[0-9]*.fwsc

      - name: A published release never changes (refused when the release already has assets)
        if: needs.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if out=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>&1); then
            n=$out
          elif echo "$out" | grep -qi 'not found'; then
            n=0                            # no release yet: the next step creates it
          else
            echo "$out"; exit 1
          fi
          if [ "$n" != 0 ]; then
            echo "::error::release $TAG already has $n assets; a published release never changes"
            exit 1
          fi

      - name: Release (tags only)
        if: needs.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # the release builds, not the dev ones; no comment inside the list: it would become part of the pattern
          files: |
            build/knobi-six-[0-9]*.fwsc
            build/SHA256SUMS
            build/knobi-six-*-src.tar.gz
          generate_release_notes: true

  # The release file for the portal: a pull request release/<tag> into main with synths/<synth>/releases/<version>.md
  # (CI-owned fields filled, a first draft of the notes). João edits the notes and merges it with the admin bypass: a
  # pull request opened with the workflow's token does not start other workflows, so its checks never run.
  release-pr:
    needs: [meta, firmware]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
      SYNTH: ${{ needs.meta.outputs.synth }}
      V: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: The release's assets (with their uploaders) and files
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets' > assets.json
          gh release download "$TAG" -D release

      - name: The release file (verifies the uploaders, the hashes, the identities; refuses an existing file)
        run: |
          node packages/content/src/cli/release-pr.ts --tag "$TAG" --dir release --assets assets.json \
            --out "synths/$SYNTH/releases/$V.md"

      - name: Commit, push, open the pull request
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/$TAG"
          git add "synths/$SYNTH/releases/$V.md"
          git commit -m "docs(release): $SYNTH $V release file"
          git push origin "release/$TAG"
          {
            echo "Release file for \`$TAG\`, written by the release workflow from the release's assets (uploader, SHA256SUMS,"
            echo "identity and loader mark verified). The CI-owned fields (version, date, tag, source, builds) are not edited."
            echo
            echo "1. Review and rewrite the release notes (the Markdown body); set \`current\` if this is the one to show."
            echo "2. Merge with the **admin bypass**: this pull request was opened with the workflow's token, so the"
            echo "   checks do not run on it (it adds one Markdown file)."
            echo
            echo "Merging publishes it: the portal deploys what is on \`main\`."
          } > pr-body.md
          gh pr create --base main --head "release/$TAG" --title "Release $SYNTH $V" --body-file pr-body.md
